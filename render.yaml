services:
  - type: web
    name: abhijeet-portfolio
    runtime: python
    buildCommand: "pip install -r requirements-deploy.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn Portfolio.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_USERNAME
        value: "Abhijeet288"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  - name: portfolio-db
    plan: free
